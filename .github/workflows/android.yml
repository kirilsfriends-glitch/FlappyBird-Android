name: android

on:
  push:
    branches:
      - arena/01a0e40b-flappybird-android
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Быстрая проверка: ядро на Java должно сходиться с Python байт в байт.
  core-jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Векторы в приложении совпадают с docs/
        run: cmp docs/test-vectors.txt android/app/src/main/assets/test-vectors.txt

      - name: Компиляция ядра
        run: |
          mkdir -p out/classes
          javac -encoding UTF-8 -source 8 -target 8 -nowarn \
            -d out/classes \
            $(find android/app/src/main/java/ai/triglyph/core -name '*.java')

      - name: Самопроверка на эталонных векторах Python
        run: java -cp out/classes ai.triglyph.core.SelfCheck docs/test-vectors.txt --emit java-containers.txt

      - name: Python открывает контейнеры, созданные Java
        run: python tools/verify_java_containers.py java-containers.txt

  # Сборка APK.
  apk:
    runs-on: ubuntu-latest
    needs: core-jvm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Сборка debug и release
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Размеры
        run: ls -la android/app/build/outputs/apk/debug android/app/build/outputs/apk/release

      - uses: actions/upload-artifact@v4
        with:
          name: triglyph-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Выложить релиз с APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="apk-$(date -u +%Y%m%d-%H%M%S)"
          notes=$(cat <<'EOF'
          **TRIGLYPH / ТРИГЛИФ / 三纹密码** — приложение для Android.

          * каскад XChaCha20-Poly1305 → AES-256-GCM → Threefish-1024-CTR → HMAC-SHA3-512;
          * ноль разрешений, никакой сети;
          * интерфейс на русском, английском и китайском;
          * встроенная самопроверка на эталонных векторах Python-версии.

          Ставить: `triglyph-release.apk` (разрешите установку из неизвестных источников).
          EOF
          )
          cp android/app/build/outputs/apk/release/app-release.apk triglyph-release.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk triglyph-debug.apk
          gh release create "$tag" \
            --title "TRIGLYPH APK ($tag)" \
            --notes "$notes" \
            --target "${{ github.sha }}" \
            triglyph-release.apk triglyph-debug.apk
